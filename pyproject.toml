[project]
name = "kis-event"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "beautifulsoup4",
    "lxml",
    "pillow",
    "pydantic",
    "fastapi",
    "uvicorn",
    "apscheduler",
    "mcp",
    "numpy",
    "platformdirs>=4.11.9",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
