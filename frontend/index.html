<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIS Event</title>
<style>
:root {
  color-scheme: light;
  --plane: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --line: #e1e0d9;
  --border: rgba(11, 11, 11, 0.10);
  --branch: #2a78d6;
  --banki: #1baf7a;
  --pension: #b0672a;
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --wash: rgba(11, 11, 11, 0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --line: #2c2c2a;
    --border: rgba(255, 255, 255, 0.10);
    --branch: #3987e5;
    --banki: #199e70;
    --pension: #d08a4a;
    --wash: rgba(255, 255, 255, 0.06);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d;
  --surface: #1a1a19;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --line: #2c2c2a;
  --border: rgba(255, 255, 255, 0.10);
  --branch: #3987e5;
  --banki: #199e70;
  --pension: #d08a4a;
  --wash: rgba(255, 255, 255, 0.06);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--plane);
  color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 56px; }

header.bar {
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 20px;
}
h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.bar .meta { color: var(--ink-2); font-size: 13px; }
.bar .right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
.state { font-size: 12px; color: var(--muted); }
.state.err { color: var(--critical); }
.pill {
  font-size: 12px; color: var(--ink-2); background: var(--wash);
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px; white-space: nowrap;
}
.pill.live { color: var(--ink); border-color: var(--warning); }
.alert {
  display: none; margin-bottom: 16px; padding: 10px 14px; border-radius: 10px; font-size: 13px;
  border: 1px solid var(--critical); color: var(--critical); background: var(--surface);
}
.alert.show { display: block; }

button {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 7px 13px; cursor: pointer; white-space: nowrap;
}
button:hover:not(:disabled) { background: var(--wash); }
button:disabled { color: var(--muted); cursor: default; }

.tiles {
  display: grid; gap: 10px; margin-bottom: 22px;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
}
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .label { color: var(--ink-2); font-size: 12px; }
.tile .value { font-size: 26px; font-weight: 600; margin-top: 2px; letter-spacing: -0.02em; }
.tile.lead .value { font-size: 40px; }
.tile.warn .value { color: var(--critical); }

h2 { font-size: 14px; font-weight: 600; margin: 26px 0 10px; color: var(--ink-2); }

.filters { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-bottom: 12px; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.group > span { font-size: 12px; color: var(--muted); }
.chip {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--plane); border-color: var(--ink); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
tbody tr:last-child td { border-bottom: none; }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover { background: var(--wash); }
tbody tr.row[aria-selected="true"] { background: var(--wash); }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.t-title { font-weight: 500; color: var(--ink); }
.t-title.ended { color: var(--ink-2); font-weight: 400; }
.dim { color: var(--muted); }

.tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-2); margin-right: 4px; white-space: nowrap; }
.tag.영업점 { border-color: var(--branch); color: var(--branch); }
.tag.뱅키스 { border-color: var(--banki); color: var(--banki); }
.tag.연금 { border-color: var(--pension); color: var(--pension); }
.tag.none { color: var(--muted); border-style: dashed; }

#detail { margin: 18px 0 0; padding: 18px 20px 20px; }
#detail .head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
#detail h3 { margin: 0 0 6px; font-size: 18px; letter-spacing: -0.01em; }
#detail .sub { color: var(--ink-2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
#detail .lead { margin-top: 10px; font-size: 15px; color: var(--ink); }
.dday { font-weight: 600; color: var(--ink); }
.dday.soon { color: var(--critical); }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); margin-top: 16px; }
.info { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--plane); }
.info > h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.02em; }
.info .main { font-size: 15px; color: var(--ink); font-weight: 500; }
.info .row { margin-top: 10px; }
.info .row > .k { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.info .chips { margin-bottom: 8px; }
ul.list { margin: 4px 0 0; padding-left: 0; list-style: none; color: var(--ink-2); }
ul.list li { margin: 3px 0; padding-left: 18px; position: relative; }
ul.list li::before { content: "✓"; position: absolute; left: 0; color: var(--good); }
ul.list.caveat li::before { content: "✕"; color: var(--critical); }
ul.list.caveat li { color: var(--critical); }
.perf { margin-top: 10px; padding: 8px 10px; border-left: 3px solid var(--warning); background: var(--wash); color: var(--ink); border-radius: 0 6px 6px 0; }
.section { margin-top: 16px; }
.section > h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.02em; }
.kv { color: var(--ink-2); }
.notice { margin-top: 16px; padding: 10px 12px; border: 1px dashed var(--border); border-radius: 8px; color: var(--muted); font-size: 13px; }
.reason { margin-top: 16px; }
.reason summary { color: var(--muted); }
.reason .kv { margin-top: 6px; font-size: 13px; }
a { color: var(--branch); }
.empty { padding: 18px; color: var(--muted); font-size: 13px; }
details summary { cursor: pointer; color: var(--branch); font-size: 13px; }
.banner { margin-top: 8px; max-height: 520px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.banner img { display: block; width: 100%; height: auto; }

@media (max-width: 720px) {
  .hide-sm { display: none; }
  .tile .value { font-size: 22px; }
  .tile.lead .value { font-size: 32px; }
  th, td { padding: 8px 10px; }
  .bar .right { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <h1>KIS Event</h1>
    <span class="meta" id="last-run">마지막 수집 —</span>
    <div class="right">
      <span class="pill" id="crawl-pill">대기</span>
      <span class="state" id="state"></span>
      <button id="scrape-backfill">지난 이벤트 100건 수집</button>
    </div>
  </header>

  <div class="alert" id="alert"></div>

  <div class="tiles" id="tiles"></div>

  <h2>이벤트</h2>
  <div class="filters">
    <div class="group" id="f-target"><span>대상</span></div>
    <div class="group" id="f-state"><span>상태</span></div>
    <span class="state" id="count"></span>
  </div>
  <div class="card scroll">
    <table>
      <thead><tr>
        <th>제목</th><th>대상</th><th class="hide-sm">기간</th><th>요약</th>
      </tr></thead>
      <tbody id="events"><tr><td colspan="4" class="empty">불러오는 중…</td></tr></tbody>
    </table>
  </div>

  <div class="card" id="detail" hidden></div>

  <h2>수집 이력</h2>
  <div class="card scroll">
    <table>
      <thead><tr>
        <th>시작</th><th>모드</th><th>소요(초)</th><th>신규</th><th>갱신</th><th>이미지</th><th>오류</th>
      </tr></thead>
      <tbody id="runs"><tr><td colspan="7" class="empty">불러오는 중…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const TARGETS = [["", "전체"], ["영업점", "영업점"], ["뱅키스", "뱅키스"], ["연금", "연금"], ["미상", "요약 전"]];
const EVENT_STATES = [["ongoing", "진행중"], ["ended", "종료"], ["all", "전체"]];
const MODE_LABEL = { live: "진행중", backfill: "지난 이벤트" };
const POLL_IDLE_MS = 15000;
const POLL_RUNNING_MS = 3000;

const state = {
  events: [], target: "", eventState: "ongoing",
  selected: null, crawl: null, lockUntil: 0, timer: null,
};

const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function runSummary(run) {
  if (run.error) return `실패(${run.error})`;
  const mode = MODE_LABEL[run.mode] || run.mode || "";
  return `${mode} ${run.events_seen ?? "—"}건, 신규 ${run.new_count ?? 0}, 갱신 ${run.updated_count ?? 0}`;
}

function minutesSince(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return Math.max(0, Math.floor((Date.now() - d.getTime()) / 60000));
}

function fmtAgo(iso) {
  const m = minutesSince(iso);
  if (m === null) return "—";
  if (m < 1) return "방금";
  if (m < 60) return `${m}분 전`;
  if (m < 1440) return `${Math.floor(m / 60)}시간 전`;
  return `${Math.floor(m / 1440)}일 전`;
}

function setState(text, isError) {
  const node = $("state");
  node.textContent = text || "";
  node.classList.toggle("err", !!isError);
}

function setAlert(text) {
  const node = $("alert");
  node.textContent = text || "";
  node.classList.toggle("show", !!text);
}

async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url} → ${res.status}`);
  return res.json();
}

function tile(label, value, cls) {
  const node = el("div", cls ? `tile ${cls}` : "tile");
  node.append(el("div", "label", label), el("div", "value", value));
  return node;
}

function summaryText(summary) {
  const text = (summary && summary.criteria && summary.criteria.text)
    || (summary && summary.target && summary.target.text) || "";
  return text.length > 60 ? `${text.slice(0, 60)}…` : text;
}

function targetTags(targetTypes, summarized) {
  const box = el("span");
  if (!summarized) {
    box.append(el("span", "tag none", "요약 전"));
    return box;
  }
  if (!targetTypes || !targetTypes.length) {
    box.append(el("span", "tag none", "미상"));
    return box;
  }
  targetTypes.forEach((t) => box.append(el("span", `tag ${t}`, t)));
  return box;
}

function renderStats(stats, runs) {
  // 실행 중인 run은 finished_at이 없으므로 마지막으로 끝난 run을 찾는다
  const lastDone = runs.find((r) => r.finished_at) || null;
  $("last-run").textContent = lastDone ? `${fmtAgo(lastDone.finished_at)} 수집 - ${runSummary(lastDone)}` : "아직 수집 없음 — 에이전트에게 이벤트를 물으면 수집됩니다";

  const running = stats.crawl && stats.crawl.state === "running";
  if (!running && lastDone && lastDone.error) {
    setAlert(`마지막 수집 실패: ${lastDone.error}`);
  } else {
    setAlert("");
  }

  $("tiles").replaceChildren(
    tile("진행중 이벤트", stats.events_active, "lead"),
    tile("요약 전(진행중)", stats.pending_ongoing, stats.pending_ongoing ? "warn" : ""),
    tile("영업점", stats.by_target["영업점"]),
    tile("뱅키스", stats.by_target["뱅키스"]),
    tile("연금", stats.by_target["연금"]),
  );
}

function matchesTarget(event) {
  const types = event.target_types;
  if (state.target === "미상") return event.summary_status === "none" || !types || !types.length;
  return !!types && types.includes(state.target);
}

function renderEvents() {
  const rows = state.target ? state.events.filter(matchesTarget) : state.events;
  const body = $("events");
  $("count").textContent = `${rows.length}건 / 전체 ${state.events.length}건`;

  if (!rows.length) {
    const tr = el("tr");
    const td = el("td", "empty", "조건에 맞는 이벤트가 없습니다");
    td.colSpan = 4;
    tr.append(td);
    body.replaceChildren(tr);
    return;
  }

  body.replaceChildren(...rows.map((event) => {
    const tr = el("tr", "row");
    if (state.selected === event.num) tr.setAttribute("aria-selected", "true");
    tr.onclick = () => selectEvent(event.num);

    const title = el("td");
    title.append(el("div", event.state === "ended" ? "t-title ended" : "t-title", event.title));
    if (event.state === "ended" && state.eventState === "all") title.append(el("div", "dim", "종료"));
    tr.append(title);

    const target = el("td");
    target.append(targetTags(event.target_types, event.summary_status === "summarized"));
    tr.append(target);

    tr.append(el("td", "hide-sm num dim", `${event.period_start || "—"} ~ ${event.period_end || "—"}`));

    const text = summaryText(event.summary);
    tr.append(text ? el("td", null, text) : el("td", "dim", "-"));
    return tr;
  }));
}

function renderRuns(runs) {
  const body = $("runs");
  // 마지막 실행 1건 + 변화가 있었던 실행(신규·갱신·이미지·오류)만 보인다
  const notable = runs.filter((r, i) => i === 0 || r.error || r.new_count || r.updated_count || r.image_count);
  const shown = notable.slice(0, 8);
  if (!shown.length) {
    const tr = el("tr");
    const td = el("td", "empty", "실행 이력이 없습니다");
    td.colSpan = 7;
    tr.append(td);
    body.replaceChildren(tr);
    return;
  }
  body.replaceChildren(...shown.map((run) => {
    const tr = el("tr");
    tr.append(el("td", "num", fmtTime(run.started_at)));
    tr.append(el("td", null, MODE_LABEL[run.mode] || run.mode || "—"));
    tr.append(el("td", "num", run.duration_sec === null ? "실행 중" : run.duration_sec));
    tr.append(el("td", "num", run.new_count ?? "—"));
    tr.append(el("td", "num", run.updated_count ?? "—"));
    tr.append(el("td", "num", run.image_count ?? "—"));
    tr.append(run.error ? el("td", null, run.error) : el("td", "dim", "—"));
    return tr;
  }));
  if (notable.length === 1 && runs.length > 1) {
    const tr = el("tr");
    const td = el("td", "empty", `최근 ${runs.length}회 중 나머지는 변화 없음`);
    td.colSpan = 7;
    tr.append(td);
    body.append(tr);
  }
}

function section(title, ...nodes) {
  const box = el("div", "section");
  box.append(el("h4", null, title), ...nodes);
  return box;
}

function bullets(items, cls) {
  const ul = el("ul", cls ? `list ${cls}` : "list");
  items.forEach((item) => ul.append(el("li", null, item)));
  return ul;
}

function card(title, ...nodes) {
  const box = el("div", "info");
  box.append(el("h4", null, title), ...nodes);
  return box;
}

function row(label, node) {
  const r = el("div", "row");
  r.append(el("div", "k", label), node);
  return r;
}

function daysLeft(periodEnd) {
  if (!periodEnd) return null;
  const end = new Date(periodEnd.replace(/\./g, "-") + "T23:59:59");
  if (isNaN(end)) return null;
  return Math.ceil((end - Date.now()) / 86400000);
}

function ddayNode(event) {
  const d = daysLeft(event.period_end);
  if (d === null || event.state === "ended") return null;
  const node = el("span", d <= 7 ? "dday soon" : "dday");
  node.textContent = d < 0 ? "기간 지남" : d === 0 ? "오늘 마감" : `D-${d}`;
  return node;
}

function summaryCards(summary) {
  const cards = el("div", "cards");
  const t = summary.target || {};
  const target = card("참여 대상");
  const chips = el("div", "chips");
  chips.append(targetTags(t.types, true));
  target.append(chips);
  target.append(el("div", "main", t.text || "대상 문구 없음"));
  if (t.conditions && t.conditions.length) target.append(row("참여 조건", bullets(t.conditions)));
  if (t.exclusions && t.exclusions.length) target.append(row("제외 대상", bullets(t.exclusions, "caveat")));
  cards.append(target);

  const c = summary.criteria;
  if (c) {
    const crit = card("대상 상품·계좌 및 기준");
    if (c.text) crit.append(el("div", "main", c.text));
    if (c.products && c.products.length) {
      const pchips = el("div");
      c.products.forEach((name) => pchips.append(el("span", "tag", name)));
      crit.append(row("상품 분류", pchips));
    }
    if (c.performance) crit.append(row("실적 인정 기준", el("div", "perf", c.performance)));
    cards.append(crit);
  }
  return cards;
}

function sourceLink(event) {
  const a = el("a", null, "원문 보기");
  const tab = event.seen_tab || (event.state === "ended" ? "t" : "i");
  a.href = `https://securities.koreainvestment.com/main/customer/notice/Event.jsp?gubun=${tab}&cmd=TF04gb010002&num=${encodeURIComponent(event.num)}&currentPage=1&CUSTGUBUN=00`;
  a.target = "_blank";
  a.rel = "noopener";
  return a;
}

function renderDetail(event) {
  const panel = $("detail");
  const head = el("div", "head");
  const left = el("div");
  left.append(el("h3", null, event.title));

  const sub = el("div", "sub");
  sub.append(el("span", null, `신청 기간 ${event.period_start || "—"} ~ ${event.period_end || "—"}`));
  const dday = ddayNode(event);
  if (dday) sub.append(dday);
  sub.append(el("span", "tag", event.state === "ended" ? "종료" : "진행중"));
  sub.append(el("span", "dim", `No.${event.num}`));
  sub.append(sourceLink(event));
  left.append(sub);
  if (event.list_summary) left.append(el("div", "lead", event.list_summary));

  const close = el("button", null, "닫기");
  close.onclick = () => { state.selected = null; panel.hidden = true; renderEvents(); };
  head.append(left, close);
  panel.replaceChildren(head);

  if (event.summary) {
    if (event.summary.block_found === false) {
      panel.append(el("div", "notice", "배너에서 참여 대상 정보를 찾지 못했습니다. 원문을 확인하세요."));
    }
    panel.append(summaryCards(event.summary));
    if (event.summary.analysis) {
      const reason = el("details", "reason");
      reason.append(el("summary", null, "판단 근거"), el("div", "kv", event.summary.analysis));
      panel.append(reason);
    }
  } else {
    panel.append(el("div", "notice", "아직 분석 전입니다 — 에이전트에게 이 이벤트를 물으면 배너를 읽어 채웁니다."));
  }

  const image = event.image;
  if (!image) {
    panel.append(section("배너", el("div", "dim", "배너 이미지가 없습니다")));
    return;
  }
  const details = el("details");
  details.append(el("summary", null, "배너 보기"));
  const box = el("div", "banner");
  const img = el("img");
  img.loading = "lazy";
  img.alt = event.title;
  details.ontoggle = () => { if (details.open && !img.src) img.src = image.image_url; };
  box.append(img);
  details.append(box);
  panel.append(section("배너", details));
}

async function selectEvent(num) {
  state.selected = num;
  renderEvents();
  const panel = $("detail");
  panel.hidden = false;
  panel.replaceChildren(el("div", "empty", "불러오는 중…"));
  try {
    renderDetail(await getJSON(`/api/events/${encodeURIComponent(num)}`));
  } catch (err) {
    panel.replaceChildren(el("div", "empty", `상세를 불러오지 못했습니다: ${err.message}`));
  }
  panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function buildFilters() {
  const bind = (host, options, key, onChange) => {
    options.forEach(([value, label]) => {
      const chip = el("button", "chip", label);
      chip.setAttribute("aria-pressed", String(state[key] === value));
      chip.onclick = () => {
        state[key] = value;
        host.querySelectorAll(".chip").forEach((node) => node.setAttribute("aria-pressed", "false"));
        chip.setAttribute("aria-pressed", "true");
        (onChange || renderEvents)();
      };
      host.append(chip);
    });
  };
  bind($("f-target"), TARGETS, "target");
  bind($("f-state"), EVENT_STATES, "eventState", loadEvents);
}

function updateButton() {
  const running = state.crawl && state.crawl.state === "running";
  $("scrape-backfill").disabled = !!(running || Date.now() < state.lockUntil);
}

function renderCrawl(crawl) {
  state.crawl = crawl;
  const pill = $("crawl-pill");
  if (crawl.state === "running") {
    const mode = MODE_LABEL[crawl.mode] || crawl.mode || "";
    pill.textContent = `${mode} 수집 중 · ${crawl.page}페이지 · ${crawl.events_seen}건`;
    pill.classList.add("live");
  } else {
    pill.textContent = "대기";
    pill.classList.remove("live");
  }
  updateButton();
}

function schedule() {
  clearTimeout(state.timer);
  const running = state.crawl && state.crawl.state === "running";
  state.timer = setTimeout(refresh, running ? POLL_RUNNING_MS : POLL_IDLE_MS);
}

async function loadEvents() {
  const events = await getJSON(`/api/events?state=${encodeURIComponent(state.eventState)}`);
  state.events = events.events;
  renderEvents();
}

async function refresh() {
  try {
    const [stats, runs] = await Promise.all([getJSON("/api/stats"), getJSON("/api/runs?limit=20")]);
    renderStats(stats, runs);
    renderCrawl(stats.crawl);
    await loadEvents();
    renderRuns(runs);
    setState("");
  } catch (err) {
    setAlert(`서버 응답 없음 — ${err.message}`);
    setState("");
  }
  schedule();
}

async function backfill() {
  if (Date.now() < state.lockUntil) return;
  try {
    const res = await fetch("/api/scrape?mode=backfill", { method: "POST" });
    const body = await res.json();
    if (res.status === 202) {
      renderCrawl({ ...(state.crawl || {}), state: "running", mode: "backfill", page: 0, events_seen: 0 });
      setState("수집 시작");
      schedule();
      return;
    }
    if (res.status === 409) { setState("이미 수집 중입니다", true); return; }
    if (res.status === 429) {
      const secs = body.retry_after_sec || 60;
      state.lockUntil = Date.now() + secs * 1000;
      setState(`${secs}초 뒤 다시 시도하세요`, true);
      updateButton();
      setTimeout(updateButton, secs * 1000);
      return;
    }
    throw new Error(body.error || res.status);
  } catch (err) {
    setState(`요청 실패: ${err.message}`, true);
  }
}

buildFilters();
$("scrape-backfill").onclick = backfill;
refresh();
</script>
</body>
</html>
