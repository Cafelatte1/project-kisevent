<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIS Event</title>
<style>
:root {
  color-scheme: light;
  --plane: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --line: #e1e0d9;
  --border: rgba(11, 11, 11, 0.10);
  --branch: #2a78d6;
  --banki: #1baf7a;
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --wash: rgba(11, 11, 11, 0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --line: #2c2c2a;
    --border: rgba(255, 255, 255, 0.10);
    --branch: #3987e5;
    --banki: #199e70;
    --wash: rgba(255, 255, 255, 0.06);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d;
  --surface: #1a1a19;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --line: #2c2c2a;
  --border: rgba(255, 255, 255, 0.10);
  --branch: #3987e5;
  --banki: #199e70;
  --wash: rgba(255, 255, 255, 0.06);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--plane);
  color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 56px; }

header.bar {
  display: flex; flex-wrap: wrap; gap: 12px 16px;
  align-items: baseline; justify-content: space-between;
  padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 20px;
}
h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.bar .meta { color: var(--ink-2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.bar .right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.state { font-size: 12px; color: var(--muted); }
.state.err { color: var(--critical); }
.pill {
  font-size: 12px; color: var(--ink-2); background: var(--wash);
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px; white-space: nowrap;
}
.pill.live { color: var(--ink); border-color: var(--warning); }

button {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 7px 13px; cursor: pointer;
}
button:hover:not(:disabled) { background: var(--wash); }
button:disabled { color: var(--muted); cursor: default; }

.tiles {
  display: grid; gap: 10px; margin-bottom: 8px;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
}
.tile {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 14px;
}
.tile .label { color: var(--ink-2); font-size: 12px; }
.tile .value { font-size: 26px; font-weight: 600; margin-top: 2px; letter-spacing: -0.02em; }
.tile.lead .value { font-size: 40px; }
.tiles.small .tile .value { font-size: 20px; }
.tiles.small { margin-bottom: 22px; }

h2 { font-size: 14px; font-weight: 600; margin: 26px 0 10px; color: var(--ink-2); }

.filters { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-bottom: 12px; }
.group { display: flex; gap: 6px; align-items: center; }
.group > span { font-size: 12px; color: var(--muted); }
.chip {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--plane); border-color: var(--ink); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
tbody tr:last-child td { border-bottom: none; }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover { background: var(--wash); }
tbody tr.row[aria-selected="true"] { background: var(--wash); }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.t-title { font-weight: 500; color: var(--ink); }
.dim { color: var(--muted); }

.badge { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 12px; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
.dot.summarized { background: var(--good); }
.dot.failed { background: var(--critical); }
.tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-2); margin-right: 4px; white-space: nowrap; }
.tag.영업점 { border-color: var(--branch); color: var(--branch); }
.tag.뱅키스 { border-color: var(--banki); color: var(--banki); }
.tag.미상 { color: var(--muted); }

#detail { margin: 18px 0 0; padding: 16px 18px; }
#detail .head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
#detail h3 { margin: 0 0 4px; font-size: 16px; }
#detail .sub { color: var(--ink-2); font-size: 13px; }
.section { margin-top: 16px; }
.section > h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.02em; }
ul.list { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); }
ul.list li { margin: 2px 0; }
ul.list.caveat li { color: var(--critical); }
.kv { color: var(--ink-2); }
a { color: var(--branch); }
.empty { padding: 18px; color: var(--muted); font-size: 13px; }

@media (max-width: 720px) {
  .hide-sm { display: none; }
  .tile .value { font-size: 22px; }
  .tile.lead .value { font-size: 32px; }
  th, td { padding: 8px 10px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div>
      <h1>KIS Event</h1>
      <div class="meta">
        <span id="last-run">마지막 수집 —</span>
        <span id="next-run">다음 수집 —</span>
      </div>
    </div>
    <div class="right">
      <span class="pill" id="crawl-pill">대기</span>
      <span class="state err" id="crawl-err"></span>
      <span class="state" id="state"></span>
      <button id="scrape-live">지금 동기화</button>
      <button id="scrape-backfill">과거 100건 백필</button>
    </div>
  </header>

  <div class="tiles" id="tiles-main"></div>
  <div class="tiles small" id="tiles-img"></div>

  <h2>이벤트</h2>
  <div class="filters">
    <div class="group" id="f-target"><span>대상</span></div>
    <div class="group" id="f-state"><span>상태</span></div>
    <div class="group" id="f-status"><span>분석</span></div>
    <span class="state" id="count"></span>
  </div>
  <div class="card scroll">
    <table>
      <thead><tr>
        <th>제목</th><th>대상</th><th>상태</th><th>기간</th><th class="hide-sm">템플릿</th>
        <th>분석</th><th class="hide-sm">요약</th>
      </tr></thead>
      <tbody id="events"><tr><td colspan="7" class="empty">불러오는 중…</td></tr></tbody>
    </table>
  </div>

  <div class="card" id="detail" hidden></div>

  <h2>최근 실행</h2>
  <div class="card scroll">
    <table>
      <thead><tr>
        <th>시작</th><th>소요(초)</th><th>신규</th><th>갱신</th><th>이미지</th><th>오류</th>
      </tr></thead>
      <tbody id="runs"><tr><td colspan="6" class="empty">불러오는 중…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const STATUS_LABEL = { pending: "요약 대기", summarized: "요약 완료", failed: "실패" };
const TARGETS = [["", "전체보기"], ["영업점", "영업점"], ["뱅키스", "뱅키스"], ["연금", "연금"], ["미상", "미상"]];
const ANALYSIS = [["", "전체"], ["summarized", "요약 완료"], ["none", "미요약"]];
const EVENT_STATES = [["ongoing", "진행중"], ["ended", "종료"], ["all", "전체"]];
const STATE_LABEL = { ongoing: "진행중", ended: "종료" };
const MODE_LABEL = { live: "라이브", backfill: "백필" };

const state = {
  events: [], target: "", analysis: "", eventState: "ongoing",
  selected: null, crawl: null, lastClick: 0, lockUntil: 0,
};

const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function setState(text, isError) {
  const node = $("state");
  node.textContent = text || "";
  node.classList.toggle("err", !!isError);
}

async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url} → ${res.status}`);
  return res.json();
}

function tile(label, value, lead) {
  const node = el("div", lead ? "tile lead" : "tile");
  node.append(el("div", "label", label), el("div", "value", value));
  return node;
}

function statusBadge(status) {
  const badge = el("span", "badge");
  badge.append(el("span", `dot ${status || ""}`), el("span", null, STATUS_LABEL[status] || "이미지 없음"));
  return badge;
}

function summaryText(summary) {
  const text = (summary && summary.criteria && summary.criteria.text)
    || (summary && summary.target && summary.target.text) || "";
  return text.length > 60 ? `${text.slice(0, 60)}…` : text;
}

function targetTags(targetTypes) {
  const box = el("span");
  if (!targetTypes || !targetTypes.length) {
    box.append(el("span", "tag 미상", "미상"));
    return box;
  }
  targetTypes.forEach((t) => box.append(el("span", `tag ${t}`, t)));
  return box;
}

function renderStats(stats) {
  $("last-run").textContent = "마지막 수집 " + fmtTime(stats.last_run && stats.last_run.finished_at);
  $("next-run").textContent = `다음 수집 ${fmtTime(stats.next_run_at)} (${stats.interval_min}분 주기)`;

  const main = $("tiles-main");
  main.replaceChildren(
    tile("진행 중 이벤트", stats.events_active, true),
    tile("종료 이벤트(최근 100건)", stats.events_ended ?? 0),
    tile("영업점", stats.by_target["영업점"]),
    tile("뱅키스", stats.by_target["뱅키스"]),
    tile("24시간 신규", stats.new_last_24h),
  );

  const imgs = $("tiles-img");
  imgs.replaceChildren(
    ...Object.keys(STATUS_LABEL).map((key) => tile(STATUS_LABEL[key], stats.images[key] ?? 0)),
  );
}

function matchesTarget(event) {
  const types = event.target_types;
  if (state.target === "미상") return !types || !types.length;
  return !!types && types.includes(state.target);
}

function matches(event) {
  if (state.target && !matchesTarget(event)) return false;
  if (state.analysis === "summarized" && event.summary_status === "none") return false;
  if (state.analysis === "none" && event.summary_status !== "none") return false;
  return true;
}

function renderEvents() {
  const rows = state.events.filter(matches);
  const body = $("events");
  $("count").textContent = `${rows.length}건 / 전체 ${state.events.length}건`;

  if (!rows.length) {
    const tr = el("tr");
    const td = el("td", "empty", "조건에 맞는 이벤트가 없습니다");
    td.colSpan = 7;
    tr.append(td);
    body.replaceChildren(tr);
    return;
  }

  body.replaceChildren(...rows.map((event) => {
    const tr = el("tr", "row");
    if (state.selected === event.num) tr.setAttribute("aria-selected", "true");
    tr.onclick = () => selectEvent(event.num);

    const title = el("td");
    title.append(el("div", "t-title", event.title));
    tr.append(title);

    const target = el("td");
    target.append(targetTags(event.target_types));
    tr.append(target);

    const evState = el("td");
    evState.append(el("span", "tag", STATE_LABEL[event.state] || event.state || "—"));
    tr.append(evState);

    tr.append(el("td", "num dim", `${event.period_start || "—"} ~ ${event.period_end || "—"}`));
    tr.append(el("td", "hide-sm dim", event.template || "—"));

    const status = el("td");
    status.append(statusBadge(event.summary_status === "summarized" ? "summarized" : "pending"));
    tr.append(status);

    const text = summaryText(event.summary);
    tr.append(text ? el("td", "hide-sm", text) : el("td", "hide-sm dim", "-"));
    return tr;
  }));
}

function renderRuns(runs) {
  const body = $("runs");
  if (!runs.length) {
    const tr = el("tr");
    const td = el("td", "empty", "실행 이력이 없습니다");
    td.colSpan = 6;
    tr.append(td);
    body.replaceChildren(tr);
    return;
  }
  body.replaceChildren(...runs.map((run) => {
    const tr = el("tr");
    tr.append(el("td", "num", fmtTime(run.started_at)));
    tr.append(el("td", "num", run.duration_sec === null ? "실행 중" : run.duration_sec));
    tr.append(el("td", "num", run.new_count ?? "—"));
    tr.append(el("td", "num", run.updated_count ?? "—"));
    tr.append(el("td", "num", run.image_count ?? "—"));
    tr.append(run.error ? el("td", null, run.error) : el("td", "dim", "—"));
    return tr;
  }));
}

function section(title, ...nodes) {
  const box = el("div", "section");
  box.append(el("h4", null, title), ...nodes);
  return box;
}

function bullets(items, cls) {
  const ul = el("ul", cls ? `list ${cls}` : "list");
  items.forEach((item) => ul.append(el("li", null, item)));
  return ul;
}

function summaryNodes(summary) {
  const nodes = [];
  if (summary.analysis) nodes.push(section("요약 근거", el("div", "kv", summary.analysis)));

  const t = summary.target;
  if (t) {
    const box = el("div");
    box.append(targetTags(t.types));
    if (t.text) box.append(el("div", "kv", t.text));
    if (t.conditions && t.conditions.length) box.append(bullets(t.conditions));
    if (t.exclusions && t.exclusions.length) box.append(bullets(t.exclusions, "caveat"));
    nodes.push(section("대상", box));
  }

  const c = summary.criteria;
  if (c) {
    const box = el("div");
    box.append(el("div", "kv", c.text));
    const chips = el("div");
    (c.products || []).forEach((name) => chips.append(el("span", "tag", name)));
    if (chips.childNodes.length) box.append(chips);
    if (c.performance) box.append(el("div", "kv", `실적 인정: ${c.performance}`));
    nodes.push(section("대상 상품·계좌", box));
  }
  return nodes;
}

function renderDetail(event) {
  const panel = $("detail");
  const head = el("div", "head");
  const left = el("div");
  left.append(el("h3", null, event.title));
  left.append(el("div", "sub", `${event.period_start || "—"} ~ ${event.period_end || "—"} · 템플릿 ${event.template || "—"} · No.${event.num}`));
  const tags = el("div", "sub");
  tags.append(targetTags(event.summary && event.summary.target ? event.summary.target.types : null));
  left.append(tags);

  const close = el("button", null, "닫기");
  close.onclick = () => { state.selected = null; panel.hidden = true; renderEvents(); };
  head.append(left, close);
  panel.replaceChildren(head);

  if (event.list_summary) panel.append(section("목록 요약", el("div", "kv", event.list_summary)));
  if (event.actions && event.actions.length) panel.append(section("버튼", bullets(event.actions)));

  if (event.summary) {
    panel.append(...summaryNodes(event.summary));
  } else {
    panel.append(section("요약", el("div", "dim", "요약 전")));
  }

  const image = event.image;
  if (!image) {
    panel.append(section("이미지", el("div", "dim", "배너 이미지가 없습니다")));
    return;
  }

  const meta = el("div");
  meta.append(statusBadge(image.status));
  const link = el("a", null, "배너 이미지 열기");
  link.href = image.image_url;
  link.target = "_blank";
  link.rel = "noopener";
  meta.append(el("span", null, " · "), link);
  panel.append(section("배너", meta));
}

async function selectEvent(num) {
  state.selected = num;
  renderEvents();
  const panel = $("detail");
  panel.hidden = false;
  panel.replaceChildren(el("div", "empty", "불러오는 중…"));
  try {
    renderDetail(await getJSON(`/api/events/${encodeURIComponent(num)}`));
  } catch (err) {
    panel.replaceChildren(el("div", "empty", `상세를 불러오지 못했습니다: ${err.message}`));
  }
  panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function buildFilters() {
  const bind = (host, options, key, onChange) => {
    options.forEach(([value, label]) => {
      const chip = el("button", "chip", label);
      chip.setAttribute("aria-pressed", String(state[key] === value));
      chip.onclick = () => {
        state[key] = value;
        host.querySelectorAll(".chip").forEach((node) => node.setAttribute("aria-pressed", "false"));
        chip.setAttribute("aria-pressed", "true");
        (onChange || renderEvents)();
      };
      host.append(chip);
    });
  };
  bind($("f-target"), TARGETS, "target");
  bind($("f-state"), EVENT_STATES, "eventState", loadEvents);
  bind($("f-status"), ANALYSIS, "analysis");
}

function updateButtons() {
  const running = state.crawl && state.crawl.state === "running";
  const locked = Date.now() < state.lockUntil;
  ["scrape-live", "scrape-backfill"].forEach((id) => { $(id).disabled = !!(running || locked); });
}

function renderCrawl(crawl) {
  state.crawl = crawl;
  const pill = $("crawl-pill");
  if (crawl.state === "running") {
    const mode = MODE_LABEL[crawl.mode] || crawl.mode || "";
    pill.textContent = `${mode} 실행 중 · ${crawl.page}페이지 · ${crawl.events_seen}건`;
    pill.classList.add("live");
  } else {
    const mode = MODE_LABEL[crawl.last_mode] || crawl.last_mode;
    pill.textContent = mode
      ? `대기 · 마지막 ${mode} ${fmtTime(crawl.last_finished_at)}`
      : "대기";
    pill.classList.remove("live");
  }
  $("crawl-err").textContent = crawl.last_error || "";
  updateButtons();
}

async function pollCrawl() {
  try {
    const wasRunning = state.crawl && state.crawl.state === "running";
    const crawl = await getJSON("/api/crawl/status");
    renderCrawl(crawl);
    if (wasRunning && crawl.state === "idle") await refresh();
  } catch (err) {
    setState(`상태 조회 실패: ${err.message}`, true);
  }
}

async function loadEvents() {
  const events = await getJSON(`/api/events?state=${encodeURIComponent(state.eventState)}`);
  state.events = events.events;
  renderEvents();
}

async function refresh() {
  try {
    const [stats, runs] = await Promise.all([
      getJSON("/api/stats"), getJSON("/api/runs?limit=20"),
    ]);
    renderStats(stats);
    renderCrawl(stats.crawl);
    await loadEvents();
    renderRuns(runs);
    setState(`갱신 ${fmtTime(new Date().toISOString())}`);
  } catch (err) {
    setState(`불러오기 실패: ${err.message}`, true);
  }
}

async function scrapeNow(mode) {
  const now = Date.now();
  if (now - state.lastClick < 1000 || now < state.lockUntil) return;
  state.lastClick = now;

  try {
    const res = await fetch(`/api/scrape?mode=${mode}`, { method: "POST" });
    const body = await res.json();

    if (res.status === 202) {
      renderCrawl({ ...(state.crawl || {}), state: "running", mode, page: 0, events_seen: 0, last_error: null });
      setState(`${MODE_LABEL[mode] || mode} 시작`);
      return;
    }
    if (res.status === 409) {
      setState("이미 실행 중입니다", true);
      await pollCrawl();
      return;
    }
    if (res.status === 429) {
      const secs = body.retry_after_sec || 60;
      state.lockUntil = Date.now() + secs * 1000;
      setState(`너무 잦습니다 · ${secs}초 뒤 다시 시도하세요`, true);
      updateButtons();
      setTimeout(updateButtons, secs * 1000);
      return;
    }
    throw new Error(body.error || res.status);
  } catch (err) {
    setState(`요청 실패: ${err.message}`, true);
  }
}

buildFilters();
$("scrape-live").onclick = () => scrapeNow("live");
$("scrape-backfill").onclick = () => scrapeNow("backfill");
refresh();
setInterval(pollCrawl, 2000);
setInterval(refresh, 60000);
</script>
